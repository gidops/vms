sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.turbo/**,**/storybook-static/**,**/coverage/**,**/*.stories.tsx,**/prisma/migrations/**,**/*.config.*,**/public/**,**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,apps/frontend/e2e/**,apps/frontend/test/**
